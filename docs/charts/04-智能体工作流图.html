<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1600, initial-scale=1" />
  <title>第4章 · 智能体工作流图</title>
  <style>
    :root{
      --red:#8C1F28; --gold:#D4B374; --ink:#1A1A1A; --gray:#6B7280; --paper:#F5F1E8;
      --cn:"Source Han Serif SC","Noto Serif SC","LXGW WenKai","Songti SC",STSong,"Microsoft YaHei",serif;
      --mono:"JetBrains Mono","Inter",monospace;
    }
    *{margin:0;padding:0;box-sizing:border-box;}
    html,body{width:1600px;height:1000px;overflow:hidden;}
    body{background:#ffffff;color:var(--ink);font-family:var(--cn);-webkit-font-smoothing:antialiased;}
    .canvas{
      width:1600px;height:1000px;
      display:flex;flex-direction:column;align-items:center;justify-content:center;
    }

    /* ---------- 标题 ---------- */
    .head{text-align:center;margin-bottom:70px;}
    .kicker{font-family:var(--mono);font-size:15px;letter-spacing:.5em;padding-left:.5em;color:var(--gold);margin-bottom:16px;}
    .title{font-size:50px;font-weight:700;letter-spacing:.16em;padding-left:.16em;}
    .subtitle{margin-top:16px;font-size:18px;color:var(--gray);letter-spacing:.08em;font-family:var(--mono);}
    .rule{width:130px;height:3px;margin:22px auto 0;border-radius:2px;background:linear-gradient(90deg,var(--red),var(--gold));}

    /* ---------- 流程图 ---------- */
    .flowwrap{position:relative;width:1326px;}

    .mainrow,.branchrow{display:flex;align-items:center;justify-content:center;}
    .mainrow{width:1326px;position:relative;}
    .branchrow{position:relative;}

    .node{
      width:150px;height:86px;border-radius:12px;
      display:flex;align-items:center;justify-content:center;text-align:center;
      font-size:17px;font-weight:600;line-height:1.25;padding:10px;letter-spacing:.02em;
    }
    .node.main{
      background:var(--red);color:#fff;
      box-shadow:0 14px 26px -14px rgba(140,31,40,.9);
    }
    .node.branch{
      background:#E7E3DA;color:var(--ink);
      border:1px solid rgba(212,179,116,.85);
      height:80px;
    }

    /* 箭头 */
    .arrow{width:46px;flex:none;display:flex;align-items:center;justify-content:center;}
    .arrow::before{content:"";width:24px;height:2px;background:var(--gold);}
    .arrow::after{content:"";width:0;height:0;border-left:9px solid var(--gold);border-top:6px solid transparent;border-bottom:6px solid transparent;}

    /* 分支引出线：锚定在“记忆更新”节点正下方的箭头，标签居中放在箭头中间 */
    .downconn{position:absolute;left:858px;top:86px;width:2px;height:64px;background:var(--gold);}
    .downconn::after{
      content:"";position:absolute;left:-4px;bottom:-1px;
      width:0;height:0;border-top:9px solid var(--gold);
      border-left:5px solid transparent;border-right:5px solid transparent;
    }
    .downlabel{
      position:absolute;left:859px;top:118px;transform:translate(-50%,-50%);
      white-space:nowrap;background:#fff;padding:2px 8px;
      font-family:var(--mono);font-size:13px;letter-spacing:.06em;color:var(--gold);
    }
    .branchrow{margin-top:64px;}

    /* 分区小标签 */
    .tagline{
      font-family:var(--mono);font-size:14px;letter-spacing:.14em;color:var(--gray);
      margin-bottom:16px;
    }
    .tagline b{color:var(--red);}
  </style>
</head>
<body>
  <div class="canvas">

    <header class="head">
      <div class="kicker">CHAPTER 04 · AGENT WORKFLOW</div>
      <h1 class="title">智能体工作流</h1>
      <div class="subtitle">MAIN CHAIN · SSE STREAMING&nbsp;&nbsp;|&nbsp;&nbsp;BRANCH · WEBSOCKET PUSH</div>
      <div class="rule"></div>
    </header>

    <div class="flowwrap">

      <div class="tagline" style="margin-left:0;">主链路 <b>MAIN CHAIN</b> · SSE 流式</div>

      <div class="mainrow">
        <div class="node main">用户输入</div>
        <div class="arrow"></div>
        <div class="node main">意图识别</div>
        <div class="arrow"></div>
        <div class="node main">工具调用</div>
        <div class="arrow"></div>
        <div class="node main">数据读写</div>
        <div class="arrow"></div>
        <div class="node main">记忆更新</div>
        <div class="arrow"></div>
        <div class="node main">SSE 流式输出</div>
        <div class="arrow"></div>
        <div class="node main">用户接收</div>
        <div class="downconn"></div>
        <div class="downlabel">定时任务触发</div>
      </div>

      <div class="branchrow">
        <div class="node branch">定时任务</div>
        <div class="arrow"></div>
        <div class="node branch">规则引擎</div>
        <div class="arrow"></div>
        <div class="node branch">WebSocket 推送</div>
        <div class="arrow"></div>
        <div class="node branch">用户接收</div>
      </div>

      <div class="tagline" style="margin:22px 0 0 0;text-align:center;">分支链路 <b>BRANCH CHAIN</b> · WebSocket 主动推送</div>

    </div>

  </div>
</body>
</html>
