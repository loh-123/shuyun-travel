<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1600, initial-scale=1" />
  <title>第7章 · 数据规模分布图</title>
  <style>
    :root{
      --red:#8C1F28; --gold:#D4B374; --bamboo:#6E8B6B; --ink:#1A1A1A; --gray:#6B7280; --paper:#F5F1E8;
      --cn:"Source Han Serif SC","Noto Serif SC","LXGW WenKai","Songti SC",STSong,"Microsoft YaHei",serif;
      --mono:"JetBrains Mono","Inter",monospace;
    }
    *{margin:0;padding:0;box-sizing:border-box;}
    html,body{width:1600px;height:1000px;overflow:hidden;}
    body{background:#ffffff;color:var(--ink);font-family:var(--cn);-webkit-font-smoothing:antialiased;}
    .canvas{width:1600px;height:1000px;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:0 80px;}

    /* ---------- 标题 ---------- */
    .head{text-align:center;}
    .kicker{font-family:var(--mono);font-size:15px;letter-spacing:.5em;padding-left:.5em;color:var(--gold);margin-bottom:16px;}
    .title{font-size:50px;font-weight:700;letter-spacing:.16em;padding-left:.16em;}
    .subtitle{margin-top:14px;font-size:17px;color:var(--gray);letter-spacing:.1em;font-family:var(--mono);}
    .rule{width:130px;height:3px;margin:20px auto 0;border-radius:2px;background:linear-gradient(90deg,var(--red),var(--gold));}

    #chart{width:100%;height:560px;margin-top:10px;}
    .fallback{text-align:center;color:var(--gray);font-size:18px;padding-top:140px;font-family:var(--cn);}
  </style>
</head>
<body>
  <div class="canvas">
    <header class="head">
      <div class="kicker">CHAPTER 07 · DATA SCALE</div>
      <h1 class="title">数据规模分布</h1>
      <div class="subtitle">FIVE DATASETS · COUNT / IMAGE / VIDEO</div>
      <div class="rule"></div>
    </header>
    <div id="chart"></div>
  </div>

  <script>
    (function () {
      var urls = [
        "https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js",
        "https://unpkg.com/echarts@5.5.0/dist/echarts.min.js",
        "https://cdn.bootcdn.net/ajax/libs/echarts/5.5.0/echarts.min.js"
      ];
      function load(i) {
        if (i >= urls.length) {
          document.getElementById('chart').innerHTML =
            '<div class="fallback">ECharts 加载失败，请检查网络后刷新页面</div>';
          return;
        }
        var s = document.createElement('script');
        s.src = urls[i];
        s.onload = render;
        s.onerror = function () { load(i + 1); };
        document.head.appendChild(s);
      }

      function render() {
        if (!window.echarts) return;
        var chart = echarts.init(document.getElementById('chart'), null, { renderer: 'canvas' });
        var C = {
          red: '#8C1F28', gold: '#D4B374', bamboo: '#6E8B6B',
          ink: '#1A1A1A', gray: '#6B7280', grid: '#EAE4D7'
        };
        var cats = ['景点', '美食', '文化', '非遗', '传承人'];
        var count = [100, 100, 50, 100, 24];
        var image = [600, 200, 250, 300, 24];
        var video = [100, 100, 50, 100, 24];

        chart.setOption({
          textStyle: {
            fontFamily: '"JetBrains Mono","Inter","Source Han Serif SC","Noto Serif SC",serif'
          },
          legend: {
            top: 4, itemGap: 36, itemWidth: 18, itemHeight: 12, icon: 'roundRect',
            textStyle: { fontSize: 16, color: C.ink },
            data: ['条数', '图片', '视频']
          },
          tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' } },
          grid: { left: 100, right: 80, top: 74, bottom: 40 },
          xAxis: {
            type: 'value',
            axisLine: { lineStyle: { color: C.gray } },
            axisTick: { show: false },
            axisLabel: { color: C.gray, fontSize: 13 },
            splitLine: { lineStyle: { color: C.grid } }
          },
          yAxis: {
            type: 'category', inverse: true, data: cats,
            axisLine: { lineStyle: { color: C.gray } },
            axisTick: { show: false },
            axisLabel: { color: C.ink, fontSize: 18, fontWeight: 'bold' }
          },
          series: [
            {
              name: '条数', type: 'bar', data: count, barWidth: 16,
              itemStyle: { color: C.red, borderRadius: [0, 5, 5, 0] },
              label: { show: true, position: 'right', color: C.red, fontSize: 13, formatter: '{c}' }
            },
            {
              name: '图片', type: 'bar', data: image, barWidth: 16,
              itemStyle: { color: C.gold, borderRadius: [0, 5, 5, 0] },
              label: { show: true, position: 'right', color: '#B08A3E', fontSize: 13, formatter: '{c}' }
            },
            {
              name: '视频', type: 'bar', data: video, barWidth: 16,
              itemStyle: { color: C.bamboo, borderRadius: [0, 5, 5, 0] },
              label: { show: true, position: 'right', color: C.bamboo, fontSize: 13, formatter: '{c}' }
            }
          ]
        });

        window.addEventListener('resize', function () { chart.resize(); });
      }

      load(0);
    })();
  </script>
</body>
</html>
