<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 72 72">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE6A0" />
      <stop offset="50%" stop-color="#D4B374" />
      <stop offset="100%" stop-color="#A67C2E" />
    </linearGradient>
    <radialGradient id="gp" cx="42%" cy="36%" r="70%">
      <stop offset="0%" stop-color="#FFEDB8" />
      <stop offset="55%" stop-color="#D4B374" />
      <stop offset="100%" stop-color="#A67C2E" />
    </radialGradient>
    <linearGradient id="gr" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9A2530" />
      <stop offset="100%" stop-color="#6E141C" />
    </linearGradient>
    <radialGradient id="h" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0A1428" stop-opacity="0.45" />
      <stop offset="60%" stop-color="#0A1428" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0A1428" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- 底部暗晕（保证浅色标签栏上也能看清） -->
  <circle cx="36" cy="36" r="36" fill="url(#h)" />

  <!-- 玉璧外框（32px 下加粗，保证可辨） -->
  <circle cx="36" cy="36" r="34" fill="none" stroke="url(#g)" stroke-width="2.4" />
  <circle cx="36" cy="36" r="28" fill="none" stroke="url(#g)" stroke-width="1.1" opacity="0.55" />

  <!-- 四方如意云纹 -->
  <g fill="url(#g)" opacity="0.9">
    <g transform="translate(36 4.8)">
      <circle cx="-2.5" cy="0.5" r="1.3" />
      <circle cx="0" cy="-0.5" r="1.7" />
      <circle cx="2.5" cy="0.5" r="1.3" />
    </g>
    <g transform="translate(67.2 36) rotate(90)">
      <circle cx="-2.5" cy="0.5" r="1.3" />
      <circle cx="0" cy="-0.5" r="1.7" />
      <circle cx="2.5" cy="0.5" r="1.3" />
    </g>
    <g transform="translate(36 67.2) rotate(180)">
      <circle cx="-2.5" cy="0.5" r="1.3" />
      <circle cx="0" cy="-0.5" r="1.7" />
      <circle cx="2.5" cy="0.5" r="1.3" />
    </g>
    <g transform="translate(4.8 36) rotate(-90)">
      <circle cx="-2.5" cy="0.5" r="1.3" />
      <circle cx="0" cy="-0.5" r="1.7" />
      <circle cx="2.5" cy="0.5" r="1.3" />
    </g>
  </g>

  <!-- 太阳神鸟（缩放收进玉璧内圈） -->
  <g transform="translate(36 36) scale(0.84) translate(-36 -36)">
    <g fill="url(#g)">
      <g transform="translate(36 36)">
        <g>
          <ellipse cx="0" cy="-26.6" rx="5.4" ry="1.9" transform="rotate(-12 0 -26.6)" />
          <path d="M -5.4 -27.9 L -10 -26.3 L -5.2 -25.4 Z" />
          <ellipse cx="0.6" cy="-29.7" rx="4.3" ry="1.5" transform="rotate(-30 0.6 -29.7)" />
          <path d="M 4.4 -27.6 L 9.6 -29.6 L 6.6 -26.5 L 9.2 -24 L 4.2 -25.6 Z" />
        </g>
        <g transform="rotate(90)">
          <ellipse cx="0" cy="-26.6" rx="5.4" ry="1.9" transform="rotate(-12 0 -26.6)" />
          <path d="M -5.4 -27.9 L -10 -26.3 L -5.2 -25.4 Z" />
          <ellipse cx="0.6" cy="-29.7" rx="4.3" ry="1.5" transform="rotate(-30 0.6 -29.7)" />
          <path d="M 4.4 -27.6 L 9.6 -29.6 L 6.6 -26.5 L 9.2 -24 L 4.2 -25.6 Z" />
        </g>
        <g transform="rotate(180)">
          <ellipse cx="0" cy="-26.6" rx="5.4" ry="1.9" transform="rotate(-12 0 -26.6)" />
          <path d="M -5.4 -27.9 L -10 -26.3 L -5.2 -25.4 Z" />
          <ellipse cx="0.6" cy="-29.7" rx="4.3" ry="1.5" transform="rotate(-30 0.6 -29.7)" />
          <path d="M 4.4 -27.6 L 9.6 -29.6 L 6.6 -26.5 L 9.2 -24 L 4.2 -25.6 Z" />
        </g>
        <g transform="rotate(270)">
          <ellipse cx="0" cy="-26.6" rx="5.4" ry="1.9" transform="rotate(-12 0 -26.6)" />
          <path d="M -5.4 -27.9 L -10 -26.3 L -5.2 -25.4 Z" />
          <ellipse cx="0.6" cy="-29.7" rx="4.3" ry="1.5" transform="rotate(-30 0.6 -29.7)" />
          <path d="M 4.4 -27.6 L 9.6 -29.6 L 6.6 -26.5 L 9.2 -24 L 4.2 -25.6 Z" />
        </g>
      </g>
    </g>

    <!-- 中心金色圆盘 -->
    <circle cx="36" cy="36" r="13.5" fill="url(#gp)" stroke="#3A2711" stroke-width="0.8" />
    <!-- 中心红色「蜀」字 -->
    <text x="36" y="36" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="900"
          fill="url(#gr)" font-family="'浙江拙楷','汉仪篆书','Source Han Serif SC','STKaiti','KaiTi','SimSun',serif">蜀</text>
  </g>
</svg>
