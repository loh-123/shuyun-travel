server:
  port: 8080

spring:
  application:
    name: shuyun-travel

  # 头像等上传文件的大小限制
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/shuyun?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: "123456"

  data:
    redis:
      host: localhost
      port: 6379

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

shuyun:
  # 上传文件保存目录（相对于启动目录），通过 /upload/** 静态访问
  upload-dir: ./upload
